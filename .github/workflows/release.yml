name: Release

on:
  push:
    tags:
      - "v*"
      - "nightly-*"
      - "canary-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v1.2.3, nightly-20260514-abc1234, or canary-20260514-abc1234
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_PRERELEASE: ${{ startsWith(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'nightly-') || startsWith(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'canary-') }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore DCTravelCli.slnx

      - name: Test
        run: dotnet test DCTravelCli.slnx --configuration Release --no-restore

  publish:
    name: Publish ${{ matrix.asset_suffix }}
    needs: test
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: zip
            flavor: stable
            asset_suffix: win-x64
            experimental: false
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
            flavor: stable
            asset_suffix: linux-x64
            experimental: false
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz
            flavor: stable
            asset_suffix: osx-arm64
            experimental: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore DCTravelCli.csproj --runtime ${{ matrix.rid }}

      - name: Publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "publish-${{ matrix.asset_suffix }}"
          $args = @(
            "publish",
            "DCTravelCli.csproj",
            "--configuration", "Release",
            "--runtime", "${{ matrix.rid }}",
            "--self-contained", "true",
            "--no-restore",
            "--output", $publishDir
          )
          dotnet @args
          Get-ChildItem -LiteralPath $publishDir -Recurse -Force |
            Where-Object { $_.Name -like "*.pdb" -or $_.Name -like "*.dbg" -or $_.Name -like "*.dSYM" } |
            Remove-Item -Recurse -Force
          "PUBLISH_DIR=$publishDir" >> $env:GITHUB_ENV

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = if ("${{ runner.os }}" -eq "Windows") {
            Join-Path $env:PUBLISH_DIR "DCTravelCli.exe"
          } else {
            Join-Path $env:PUBLISH_DIR "DCTravelCli"
          }
          if ("${{ runner.os }}" -ne "Windows") {
            chmod +x $exe
          }
          & $exe --help

      - name: Package
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "packages"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          $baseName = "DCTravelCli-$env:RELEASE_TAG-${{ matrix.asset_suffix }}"
          if ("${{ matrix.archive }}" -eq "zip") {
            $assetPath = Join-Path $packageDir "$baseName.zip"
            Compress-Archive -Path (Join-Path $env:PUBLISH_DIR "*") -DestinationPath $assetPath -Force
          } else {
            $assetPath = Join-Path $packageDir "$baseName.tar.gz"
            tar -czf $assetPath -C $env:PUBLISH_DIR .
          }
          "ASSET_PATH=$assetPath" >> $env:GITHUB_ENV

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset_suffix }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              gh release create "$RELEASE_TAG" release-assets/* --title "$RELEASE_TAG" --generate-notes --verify-tag --prerelease
            else
              gh release create "$RELEASE_TAG" release-assets/* --title "$RELEASE_TAG" --generate-notes --verify-tag
            fi
          fi
